name: Build ColorBat APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Ensure Persistent Keystore
        run: |
          if [ ! -f app/colorbat.keystore ]; then
            keytool -genkey -v -keystore app/colorbat.keystore -alias colorbat -keyalg RSA -keysize 2048 -validity 10000 -storepass colorbat123 -keypass colorbat123 -dname "CN=ColorBat, OU=Mobile, O=ColorBat, L=Hanoi, S=Hanoi, C=VN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/colorbat.keystore
            git commit -m "chore: persist colorbat.keystore for stable OTA signatures" || true
            git push origin main || true
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ColorBat-v1.2.10.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorBat-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ColorBat Latest OTA Build
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
